services:
  # Database Service
  stockinsite_db:
    image: mysql:8.0
    container_name: stockinsite_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Aru.8967
      MYSQL_DATABASE: stockinsite_db
    ports:
      - "3306:3306"
    volumes:
      - ./db_files/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - stockinsite_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pAru.8967"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ollama LLM Service
  stockinsite_ollama:
    image: ollama/ollama:latest
    container_name: stockinsite_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Web Application Service (Frontend + Backend in one container)
  stockinsite_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockinsite_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=stockinsite_db
      - DB_PORT=3306
      - DB_NAME=stockinsite_db
      - DB_USER=root
      - DB_PASSWORD=Aru.8967
      - OLLAMA_URL=http://stockinsite_ollama:11434/api/chat
    depends_on:
      stockinsite_db:
        condition: service_healthy
      stockinsite_ollama:
        condition: service_started

volumes:
  stockinsite_db_data:
    driver: local
  ollama_data:
    external: true
